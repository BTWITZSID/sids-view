<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sid’s View</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:linear-gradient(160deg,#eaf1ff,#fdeef5 55%,#e6faf1);--g:rgba(255,255,255,.55);--gb:rgba(255,255,255,.75);--tx:#14171f;--mu:#6b7080;--ac:#0a84ff;--sh:0 8px 30px rgba(30,40,80,.12);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:radial-gradient(800px 500px at 0 -10%,#5a0f7a88,transparent),radial-gradient(700px 500px at 100% 5%,#00e5ff33,transparent),#07060f;--g:rgba(24,18,48,.5);--gb:rgba(0,240,255,.35);--tx:#eaf6ff;--mu:#8fb0c8;--ac:#ff2bd6;--sh:0 0 24px rgba(255,43,214,.22);color-scheme:dark}}
:root[data-theme=dark]{--bg:radial-gradient(800px 500px at 0 -10%,#5a0f7a88,transparent),radial-gradient(700px 500px at 100% 5%,#00e5ff33,transparent),#07060f;--g:rgba(24,18,48,.5);--gb:rgba(0,240,255,.35);--tx:#eaf6ff;--mu:#8fb0c8;--ac:#ff2bd6;--sh:0 0 24px rgba(255,43,214,.22);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg) fixed;color:var(--tx);font:15px/1.4 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;overflow:hidden}
.gl{background:var(--g);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--gb);box-shadow:var(--sh);border-radius:22px}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:8px 12px;border-radius:14px;cursor:pointer;transition:transform .15s,background .2s}
button:active{transform:scale(.93)}
button.on{background:var(--ac);color:#fff;text-shadow:0 0 10px var(--ac)}
button.pri{background:var(--ac);color:#fff;width:100%;margin-top:10px;padding:12px}
input[type=search],#pw{flex:1;min-width:0;background:transparent;border:1px solid var(--gb);border-radius:14px;padding:9px 12px;outline:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac)}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;gap:6px;margin:10px;padding:6px}
main{flex:1;overflow:auto;padding:0 8px 8px;-webkit-overflow-scrolling:touch}
main.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:4px;align-content:start}
.cell{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--g);animation:pop .35s both;transition:transform .2s}
.cell:active{transform:scale(.95)}
.cell img,.cell video{width:100%;height:100%;object-fit:cover;display:block}
.cell i{position:absolute;right:6px;bottom:6px;font-style:normal;font-size:11px;padding:2px 7px;border-radius:9px;background:#0008;color:#fff}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
nav{display:flex;gap:4px;margin:0 10px 10px;padding:6px;align-items:center;justify-content:space-around}
.fab{background:var(--ac);color:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;cursor:pointer;box-shadow:0 0 18px var(--ac)}
section{padding:12px;margin-bottom:10px}section h3{margin:0 0 8px;font-size:15px}
.row{display:flex;gap:6px;overflow-x:auto}.row img,.row video{height:84px;border-radius:10px;flex:none}
.ov{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg) fixed}
#lock{padding:20px}.box{width:min(340px,100%);padding:22px;text-align:center}
#chips{display:flex;gap:4px;justify-content:center;margin-bottom:12px}
#pw{width:100%;text-align:center;letter-spacing:.2em}
#pat{display:grid;grid-template-columns:repeat(3,64px);gap:22px;justify-content:center;touch-action:none;margin:14px 0}
.dot{width:64px;height:64px;border-radius:50%;border:2px solid var(--gb);transition:.15s}.dot.s{background:var(--ac);box-shadow:0 0 22px var(--ac)}
.shake{animation:sh .35s}@keyframes sh{30%{transform:translateX(-9px)}60%{transform:translateX(9px)}}
#vw{background:#000d;justify-content:flex-start;padding-top:env(safe-area-inset-top,0px)}
#stage{flex:1;width:100%;display:grid;place-items:center;min-height:0}
#stage img,#stage video{max-width:100%;max-height:100%;animation:pop .3s}
.bar{display:flex;gap:4px;align-items:center;padding:6px;margin:8px;color:var(--tx)}
#vbar input{flex:1}#acts{flex-wrap:wrap;justify-content:center}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:20;padding:10px 16px;max-width:90%}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--base:#eef2fb;--a1:#7aa7ff;--a2:#ff9ccf;--a3:#8ff0d0;--ao:.7;--g1:rgba(255,255,255,.74);--g2:rgba(255,255,255,.4);--edge:rgba(255,255,255,.95);--edge2:rgba(110,140,255,.5);--hi:rgba(255,255,255,.95);--spot:rgba(255,255,255,.6);--gl:rgba(60,80,150,.05);--cb:rgba(255,255,255,.75);--cs:rgba(40,60,120,.14);--p1:#0a84ff;--p2:#6a5cff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--base:#05040c;--a1:#00e5ff;--a2:#ff2bd6;--a3:#7c4dff;--ao:.45;--g1:rgba(30,24,64,.62);--g2:rgba(10,8,28,.42);--edge:#00f0ff;--edge2:#ff2bd6;--hi:rgba(255,255,255,.12);--spot:rgba(0,240,255,.2);--gl:rgba(0,240,255,.07);--cb:rgba(0,240,255,.22);--cs:rgba(255,43,214,.18);--p1:#ff2bd6;--p2:#7c4dff}}
:root[data-theme=dark]{--base:#05040c;--a1:#00e5ff;--a2:#ff2bd6;--a3:#7c4dff;--ao:.45;--g1:rgba(30,24,64,.62);--g2:rgba(10,8,28,.42);--edge:#00f0ff;--edge2:#ff2bd6;--hi:rgba(255,255,255,.12);--spot:rgba(0,240,255,.2);--gl:rgba(0,240,255,.07);--cb:rgba(0,240,255,.22);--cs:rgba(255,43,214,.18);--p1:#ff2bd6;--p2:#7c4dff}
body{background:var(--base);font-family:Manrope,ui-rounded,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:-30%;z-index:-1;opacity:var(--ao);background:radial-gradient(40% 30% at 20% 20%,var(--a1),transparent),radial-gradient(35% 30% at 80% 30%,var(--a2),transparent),radial-gradient(40% 35% at 50% 85%,var(--a3),transparent);animation:drift 30s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 75%)}
@keyframes drift{to{transform:translate(4%,3%) rotate(12deg) scale(1.1)}}@keyframes spin{to{--ang:360deg}}@keyframes rot{to{transform:rotate(360deg)}}
.gl{position:relative;background:linear-gradient(135deg,var(--g1),var(--g2));-webkit-backdrop-filter:blur(28px) saturate(200%);backdrop-filter:blur(28px) saturate(200%);border:1px solid transparent;box-shadow:var(--sh),inset 0 1px 0 var(--hi)}
.gl::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;background:conic-gradient(from var(--ang),transparent,var(--edge),transparent 38%,var(--edge2),transparent 78%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 9s linear infinite}
.gl::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(180px circle at var(--mx,30%) var(--my,0%),var(--spot),transparent 70%)}
header{flex-wrap:wrap;align-items:center;padding:10px}
#brand{flex:1;display:flex;align-items:center;gap:10px;padding-left:4px}
.ring{width:28px;height:28px;border-radius:50%;background:conic-gradient(from var(--ang),var(--a1),var(--a2),var(--a3),var(--a1));-webkit-mask:radial-gradient(circle,transparent 8px,#000 9px);mask:radial-gradient(circle,transparent 8px,#000 9px);animation:spin 4s linear infinite}
#brand b{font:700 16px Unbounded,Manrope,sans-serif;letter-spacing:.02em;background:linear-gradient(90deg,var(--tx),var(--a1),var(--a2),var(--tx));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:250% 0}}
#q{order:3;flex:1 0 100%;margin-top:8px;background:var(--g2);border:1px solid var(--cb);border-radius:16px;padding:11px 14px;transition:box-shadow .25s,border-color .25s}
#q:focus-visible{outline:0;border-color:var(--a1);box-shadow:0 0 0 4px color-mix(in srgb,var(--a1) 25%,transparent),0 0 22px color-mix(in srgb,var(--a1) 40%,transparent)}
button.on,button.pri{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--p1) 45%,transparent)}
button.danger{background:linear-gradient(135deg,#ff5a6e,#ff2b6a)}
nav{margin:0 14px 12px;border-radius:32px}
.cell{border-radius:18px;border:1px solid var(--cb);box-shadow:0 6px 18px var(--cs)}
.cell::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);transform:translateX(-120%);transition:transform .6s;pointer-events:none}
.cell:hover::after,.cell:active::after{transform:translateX(120%)}
.cell i{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--cb)}
.ov{background:color-mix(in srgb,var(--base) 60%,transparent);-webkit-backdrop-filter:blur(36px) saturate(160%);backdrop-filter:blur(36px) saturate(160%)}
#lock::before{content:"";position:absolute;width:520px;height:520px;max-width:130vw;border-radius:50%;border:1px dashed var(--edge2);opacity:.5;animation:rot 50s linear infinite}
#vw{overflow:hidden}#vw::before{content:"";position:absolute;inset:-10%;background:var(--amb,none) center/cover;filter:blur(48px) saturate(1.7) brightness(.55);z-index:-1}
#set{justify-content:flex-start;overflow:auto;padding:12px 14px}#set section{width:min(440px,100%)}#set .bar{width:min(440px,100%)}
.seg{display:flex;gap:6px}.seg button{flex:1;border:1px solid var(--cb)}
#lc{margin-top:6px}
</style></head><body>
<div id="lock" class="ov" hidden><div class="gl box"><h2 id="lt" style="margin:0 0 12px"></h2>
<div id="chips"><button data-m="pin" class="on">PIN</button><button data-m="password">Password</button><button data-m="pattern">Pattern</button></div>
<input id="pw" type="password" autocomplete="off"><button id="go" class="pri">Continue</button><button id="lc" hidden>Not now</button>
<div id="pat" hidden></div><p id="lm" style="color:var(--mu);min-height:1.4em;margin:8px 0 0"></p></div></div>

<div id="app" hidden>
<header class="gl"><div id="brand"><span class="ring"></span><b>Sid’s View</b></div><button id="th" aria-label="Toggle theme">☾</button><button id="lk" aria-label="Settings">⚙</button><input id="q" type="search" placeholder="Search: blue sky, receipt, dark night"></header>
<main id="g" class="grid"></main>
<nav class="gl"><button data-t="p" class="on">Photos</button><button data-t="v">Vault</button><button data-t="c">Clean</button>
<label class="fab" aria-label="Add media">＋<input id="f" type="file" accept="image/*,video/*" multiple hidden></label></nav></div>

<div id="vw" class="ov" hidden>
<div class="bar gl"><button id="vx">✕ Close</button><span id="vn" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center"></span><button id="vp">‹</button><button id="vnx">›</button></div>
<div id="stage"></div>
<div id="vbar" class="bar gl" hidden><button id="pp">❚❚</button><input id="sk" type="range" min="0" max="1000" value="0"><span id="tm" style="min-width:42px"></span><button id="sp">1×</button><button id="mu">🔊</button></div>
<div id="edp" class="bar gl" hidden><span>Extend</span><input id="ex" type="range" min="5" max="60" value="25" style="flex:1"><button id="bo">Extend</button><button id="bu">Upscale 2×</button></div>
<div id="acts" class="bar gl"><button id="aw">Wallpaper</button><button id="ae">Edit</button><button id="av">To vault</button><button id="ad">Remove</button></div></div>
<div id="set" class="ov" hidden><div class="bar gl"><b style="flex:1;padding-left:8px">Settings</b><button id="sx">Done</button></div>
<section class="gl"><h3>Appearance</h3><div class="seg"><button id="sl">Light</button><button id="sd">Dark</button></div></section>
<section class="gl"><h3>App lock</h3><p id="sls" style="margin:0 0 4px;color:var(--mu)"></p><button id="ssu" class="pri">Set up a lock</button><button id="sln" class="pri">Lock now</button><button id="srm" class="pri danger">Remove lock</button></section>
<section class="gl"><h3>About</h3><p style="margin:0;color:var(--mu)">Sid’s View keeps every scan, tag and edit on this device. No account, no cloud.</p></section></div>
<div id="toast" class="gl" hidden></div>

<script>
const $=s=>document.querySelector(s),enc=new TextEncoder(),rid=()=>Math.random().toString(36).slice(2);
const ls={get:k=>{try{return localStorage.getItem(k)}catch{}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,"0")).join(""),unhex=s=>new Uint8Array(s.match(/../g).map(h=>parseInt(h,16)));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
let items=[],cur=[],vi=0,vault=[],secret=null,vkey=null,cfg=null,mode="pin",tmp="",tab="p",picking=false,toastT;
try{cfg=JSON.parse(ls.get("pg_cfg"))}catch{}
if(cfg)mode=cfg.t;

/* theme */
const root=document.documentElement;
function theme(t){root.dataset.theme=t;$("#th").textContent=t=="dark"?"☀︎":"☾";ls.set("pg_theme",t)}
theme(ls.get("pg_theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
$("#th").onclick=()=>theme(root.dataset.theme=="dark"?"light":"dark");
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2600)}

/* storage for encrypted vault (best effort) */
const db=(()=>{try{return new Promise(r=>{const q=indexedDB.open("pg",1);q.onupgradeneeded=()=>q.result.createObjectStore("v",{keyPath:"id"});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch{return Promise.resolve(null)}})();
const st=async(m,f)=>{try{const d=await db;return d&&await new Promise(r=>{const q=f(d.transaction("v",m).objectStore("v"));q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch{}};

/* ---------- security gateway ---------- */
const bits=async(s,salt)=>{const m=await crypto.subtle.importKey("raw",enc.encode(s),"PBKDF2",false,["deriveBits"]);return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},m,256))};
function lockUI(){$("#lt").textContent=cfg?"Unlock Sid’s View":tmp?"Confirm your "+mode:"Create a "+mode+" lock";
 $("#chips").hidden=!!cfg||!!tmp;$("#lc").hidden=!!cfg;const p=mode=="pattern";$("#pat").hidden=!p;$("#pw").hidden=p;$("#go").hidden=p;
 $("#pw").inputMode=mode=="pin"?"numeric":"text";$("#pw").placeholder=mode=="pin"?"4+ digits":"6+ characters";$("#pw").value="";
 document.querySelectorAll("#chips button").forEach(b=>b.classList.toggle("on",b.dataset.m==mode))}
document.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;lockUI()});
$("#pat").innerHTML=[...Array(9)].map((_,i)=>`<div class="dot" data-i="${i}"></div>`).join("");
let seq=[];
$("#pat").onpointerdown=e=>{seq=[];e.target.setPointerCapture?.(e.pointerId);hit(e)};
$("#pat").onpointermove=e=>{if(e.buttons||e.pressure)hit(e)};
$("#pat").onpointerup=()=>{const s=seq.join("-");document.querySelectorAll(".dot").forEach(d=>d.classList.remove("s"));seq=[];if(s)sub(s)};
function hit(e){const d=document.elementFromPoint(e.clientX,e.clientY);if(d?.classList.contains("dot")&&!seq.includes(+d.dataset.i)){seq.push(+d.dataset.i);d.classList.add("s")}}
$("#go").onclick=()=>sub($("#pw").value);$("#pw").onkeydown=e=>e.key=="Enter"&&sub($("#pw").value);
const lm=t=>{$("#lm").textContent=t;$(".box").classList.remove("shake");void $(".box").offsetWidth;$(".box").classList.add("shake")};
async function sub(s){
 const n=mode=="pattern"?s.split("-").length:s.length;
 if(n<(mode=="password"?6:4))return lm(mode=="pattern"?"Connect at least 4 dots.":"Too short.");
 if(mode=="pin"&&!/^\d+$/.test(s))return lm("Use digits only.");
 if(!cfg){
  if(!tmp){tmp=s;lockUI();return lm("Enter it again to confirm.")}
  if(tmp!==s){tmp="";lockUI();return lm("Those didn’t match. Start over.")}
  const a=rnd(16),v=rnd(16);cfg={t:mode,s:hex(a),v:hex(v),h:hex(await bits(s,a))};ls.set("pg_cfg",JSON.stringify(cfg));tmp="";return unlock(s)}
 if(hex(await bits(s,unhex(cfg.s)))==cfg.h)unlock(s);else lm("Wrong "+mode+". Try again.")}
async function unlock(s){
 secret=s;vkey=await crypto.subtle.importKey("raw",await bits(s,unhex(cfg.v)),"AES-GCM",false,["encrypt","decrypt"]);
 vault=(await st("readonly",o=>o.getAll()))||[];$("#lock").hidden=true;$("#app").hidden=false;$("#lm").textContent="";render()}
function lock(){secret=vkey=null;cur.forEach(i=>i.vault&&URL.revokeObjectURL(i.url));$("#vw").hidden=true;$("#app").hidden=true;$("#lock").hidden=false;lockUI()}
$("#lk").onclick=()=>{sync();$("#set").hidden=false};
document.onvisibilitychange=()=>{if(document.hidden&&!picking&&secret)lock();if(!document.hidden)picking=false};
lockUI();

/* ---------- analysis (on-device, no network) ---------- */
const load=(src,v)=>new Promise((ok,no)=>{const e=document.createElement(v?"video":"img");e.muted=true;e.playsInline=true;e[v?"onloadeddata":"onload"]=()=>ok(e);e.onerror=no;e.src=src;if(v)e.currentTime=.1});
function px(e,w,h){const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(e,0,0,w,h);return x.getImageData(0,0,w,h).data}
const gray=(d,i)=>.299*d[i]+.587*d[i+1]+.114*d[i+2];
function analyze(e){
 const d=px(e,64,64),g=[];let R=0,G=0,B=0;
 for(let i=0;i<d.length;i+=4){R+=d[i];G+=d[i+1];B+=d[i+2];g.push(gray(d,i))}
 R/=4096;G/=4096;B/=4096;const L=(R+G+B)/3,sat=Math.max(R,G,B)-Math.min(R,G,B);
 let v=0;for(let y=1;y<63;y++)for(let x=1;x<63;x++){const i=y*64+x,l=4*g[i]-g[i-1]-g[i+1]-g[i-64]-g[i+64];v+=l*l}
 const blur=v/3844,s=px(e,9,8);let h="";
 for(let y=0;y<8;y++)for(let x=0;x<8;x++){const i=(y*9+x)*4;h+=gray(s,i)>gray(s,i+4)?1:0}
 const t=[];
 if(L<70)t.push("dark","night","low light");if(L>170)t.push("bright","daylight","sunny");
 if(B>R+12&&B>G)t.push("blue","sky","water","sea","ocean");
 if(G>R+8&&G>B+8)t.push("green","nature","trees","grass","plants");
 if(R>B+25&&R>=G)t.push("warm","sunset","orange","red","sand");
 if(sat<22&&L>150&&blur>250)t.push("document","text","receipt","note","screenshot");
 if(sat<14)t.push("grayscale");if(blur<60)t.push("blurry");
 return{tags:t,h,blur}}
const ham=(a,b)=>{let n=0;for(let i=0;i<a.length;i++)n+=a[i]!=b[i];return n};

async function add(f){
 const v=f.type.startsWith("video"),url=URL.createObjectURL(f),it={id:rid(),f,url,v,name:f.name,tags:[v?"video":"photo"],h:"",blur:999};
 items.push(it);try{const r=analyze(await load(url,v));it.tags.push(...r.tags);it.h=r.h;it.blur=r.blur}catch{}return it}
$("#f").onclick=()=>picking=true;
$("#f").onchange=async e=>{for(const f of e.target.files)await add(f);e.target.value="";picking=false;tab="p";tabs();render()};

/* ---------- views ---------- */
const g=$("#g"),io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?e.target.play().catch(()=>{}):e.target.pause()),{threshold:.6});
function th(it){const e=it.v?document.createElement("video"):new Image();e.src=it.url;if(it.v){e.muted=true;e.loop=true;e.playsInline=true;e.preload="metadata"}else e.loading="lazy";return e}
const STOP=new Set(["the","and","with","photo","photos","picture","pictures","video","videos","from","that","this"]);
async function render(){
 io.disconnect();const mine=++render.n||(render.n=1);
 if(tab=="c")return clean();
 let a;
 if(tab=="v"&&!vkey)return needLock();if(tab=="v"){a=await Promise.all(vault.map(async r=>{const b=await crypto.subtle.decrypt({name:"AES-GCM",iv:r.iv},vkey,r.data),f=new File([b],r.name,{type:r.type});return{id:r.id,f,url:URL.createObjectURL(f),v:r.type.startsWith("video"),name:r.name,vault:true,tags:[]}}));if(mine!=render.n)return}
 else{a=items;const w=$("#q").value.toLowerCase().split(/\W+/).filter(x=>x.length>2&&!STOP.has(x));
  if(w.length){const sc=i=>{const s=i.tags.join(" ")+" "+i.name.toLowerCase();return w.filter(x=>s.includes(x.replace(/s$/,""))).length};a=items.map(i=>[sc(i),i]).filter(p=>p[0]).sort((x,y)=>y[0]-x[0]).map(p=>p[1])}}
 cur=a;g.className="grid";g.replaceChildren(...a.map((it,i)=>{const c=document.createElement("div");c.className="cell";c.style.animationDelay=Math.min(i,20)*15+"ms";c.append(th(it));if(it.v){const b=document.createElement("i");b.textContent="▶ video";c.append(b);io.observe(c.firstChild)}c.onclick=()=>open(i);return c}));
 if(!a.length){g.className="";g.textContent=tab=="v"?"Your vault is empty. Open a photo and choose To vault.":$("#q").value?"No matches on this device.":"Tap ＋ to add photos and videos."}}
$("#q").oninput=()=>{if(tab!="p"){tab="p";tabs()}render()};
function tabs(){document.querySelectorAll("nav [data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t==tab))}

/* clean-up: duplicates + blur */
const rm=i=>{items=items.filter(z=>z!==i);URL.revokeObjectURL(i.url)};
const mk=(t,f)=>{const b=document.createElement("button");b.className="pri";b.textContent=t;b.onclick=f;return b};
function clean(){
 const used=new Set(),gs=[];
 for(const a of items){if(a.v||!a.h||used.has(a))continue;const m=items.filter(b=>b!==a&&!b.v&&b.h&&!used.has(b)&&ham(a.h,b.h)<=6);if(m.length){[a,...m].forEach(z=>used.add(z));gs.push([a,...m])}}
 const bl=items.filter(i=>!i.v&&i.blur<60&&!used.has(i));
 g.className="";g.replaceChildren();
 if(!gs.length&&!bl.length){g.textContent="Nothing to clean up. Add more photos to scan for duplicates and blur.";return}
 const sec=(t,a,btn)=>{const s=document.createElement("section");s.className="gl";const h=document.createElement("h3");h.textContent=t;const r=document.createElement("div");r.className="row";a.forEach(i=>r.append(th(i)));s.append(h,r,btn);g.append(s)};
 gs.forEach(a=>sec("Similar shots ("+a.length+")",a,mk("Keep sharpest, remove "+(a.length-1),()=>{const k=a.reduce((p,c)=>c.blur>p.blur?c:p);a.forEach(i=>i!==k&&rm(i));toast("Removed "+(a.length-1)+" similar");clean()})));
 if(bl.length)sec("Blurry ("+bl.length+")",bl,mk("Remove "+bl.length+" blurry",()=>{bl.forEach(rm);toast("Removed "+bl.length+" blurry");clean()}))}

/* ---------- viewer ---------- */
let M=null;
function open(i){vi=i;const it=cur[i];$("#vw").hidden=false;$("#vn").textContent=it.name;$("#stage").replaceChildren();$("#edp").hidden=true;
 M=it.v?Object.assign(document.createElement("video"),{src:it.url,loop:true,playsInline:true,autoplay:true}):new Image();if(!it.v)M.src=it.url;
 $("#stage").append(M);$("#vw").style.setProperty("--amb",it.v?"none":"url("+it.url+")");$("#vbar").hidden=!it.v;$("#aw").hidden=$("#ae").hidden=it.v;$("#av").textContent=it.vault?"Restore":"To vault";
 if(it.v){M.muted=false;M.play().catch(()=>{M.muted=true;M.play().catch(()=>{})});$("#pp").textContent="❚❚";$("#mu").textContent=M.muted?"🔇":"🔊";$("#sp").textContent="1×";
  M.ontimeupdate=()=>{$("#sk").value=M.currentTime/(M.duration||1)*1000;$("#tm").textContent=Math.floor(M.currentTime/60)+":"+String(Math.floor(M.currentTime%60)).padStart(2,"0")}}}
$("#stage").onclick=()=>{if(M?.tagName=="VIDEO"){M.paused?M.play():M.pause();$("#pp").textContent=M.paused?"▶":"❚❚"}};
$("#stage").ondblclick=e=>{if(M?.tagName=="VIDEO")M.currentTime+=e.clientX<innerWidth/2?-10:10};
$("#pp").onclick=$("#stage").onclick;$("#sk").oninput=e=>M.currentTime=e.target.value/1000*M.duration;
$("#sp").onclick=()=>{const r=[1,1.5,2,.5],n=r[(r.indexOf(M.playbackRate)+1)%4];M.playbackRate=n;$("#sp").textContent=n+"×"};
$("#mu").onclick=()=>{M.muted=!M.muted;$("#mu").textContent=M.muted?"🔇":"🔊"};
const step=d=>{if(cur.length)open((vi+d+cur.length)%cur.length)};$("#vp").onclick=()=>step(-1);$("#vnx").onclick=()=>step(1);
const close=()=>{M?.pause?.();$("#vw").hidden=true;render()};$("#vx").onclick=close;
let tx0=0;$("#stage").ontouchstart=e=>tx0=e.touches[0].clientX;$("#stage").ontouchend=e=>{const d=e.changedTouches[0].clientX-tx0;if(Math.abs(d)>70)step(d>0?-1:1)};

$("#ad").onclick=async()=>{const it=cur[vi];if(it.vault){vault=vault.filter(r=>r.id!=it.id);st("readwrite",o=>o.delete(it.id))}else rm(it);toast("Removed from Sid’s View");close()};
$("#av").onclick=async()=>{const it=cur[vi];if(!vkey&&!it.vault){toast("Set up an app lock to use the vault");return setupLock()}
 if(it.vault){vault=vault.filter(r=>r.id!=it.id);st("readwrite",o=>o.delete(it.id));await add(it.f);toast("Restored to gallery");return close()}
 const iv=rnd(12),data=await crypto.subtle.encrypt({name:"AES-GCM",iv},vkey,await it.f.arrayBuffer()),rec={id:it.id,name:it.name,type:it.f.type,iv,data};
 vault.push(rec);st("readwrite",o=>o.put(rec));rm(it);toast("Encrypted and hidden");close()};

/* wallpaper: browsers cannot set it directly, so export a screen-fit crop */
$("#aw").onclick=async()=>{const im=await load(cur[vi].url),dpr=devicePixelRatio||1,w=Math.round(screen.width*dpr),h=Math.round(screen.height*dpr),c=document.createElement("canvas");c.width=w;c.height=h;
 const k=Math.max(w/im.naturalWidth,h/im.naturalHeight),dw=im.naturalWidth*k,dh=im.naturalHeight*k;c.getContext("2d").drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);
 c.toBlob(async b=>{const f=new File([b],"wallpaper.jpg",{type:"image/jpeg"});
  if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f]});return}catch{}}
  const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click();toast("Saved. Set it as wallpaper from your system Photos app.")},"image/jpeg",.92)};

/* editing */
$("#ae").onclick=()=>$("#edp").hidden=!$("#edp").hidden;
async function out(c,name,tag){c.toBlob(async b=>{const it=await add(new File([b],name,{type:"image/jpeg"}));toast(tag+" saved to gallery");$("#vw").hidden=true;tab="p";tabs();render()},"image/jpeg",.92)}
$("#bo").onclick=async()=>{const im=await load(cur[vi].url),W=im.naturalWidth,H=im.naturalHeight,k=1+$("#ex").value/100,w=Math.round(W*k),h=Math.round(H*k),ox=(w-W)/2,oy=(h-H)/2,c=document.createElement("canvas"),x=c.getContext("2d");c.width=w;c.height=h;
 for(let i=-1;i<2;i++)for(let j=-1;j<2;j++){x.save();x.translate(ox+i*W+W/2,oy+j*H+H/2);x.scale(i?-1:1,j?-1:1);x.drawImage(im,-W/2,-H/2);x.restore()}
 const s=document.createElement("canvas");s.width=Math.max(8,w/14);s.height=Math.max(8,h/14);s.getContext("2d").drawImage(c,0,0,s.width,s.height);
 x.imageSmoothingQuality="high";x.drawImage(s,0,0,w,h);x.drawImage(im,ox,oy);out(c,"extended-"+cur[vi].name,"Extended photo")};
$("#bu").onclick=async()=>{const im=await load(cur[vi].url),W=im.naturalWidth,H=im.naturalHeight,s=Math.min(2,3200/Math.max(W,H));
 if(s<=1.05)return toast("Already high resolution");
 const w=Math.round(W*s),h=Math.round(H*s),c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true});c.width=w;c.height=h;x.imageSmoothingQuality="high";x.drawImage(im,0,0,w,h);
 toast("Sharpening…");await new Promise(r=>setTimeout(r,30));
 const id=x.getImageData(0,0,w,h),d=id.data,o=new Uint8ClampedArray(d);
 for(let y=1;y<h-1;y++)for(let X=1;X<w-1;X++){const p=(y*w+X)*4;for(let ch=0;ch<3;ch++){const q=p+ch,bl=(o[q-4]+o[q]+o[q+4]+o[q-w*4]+o[q+w*4]+o[q-w*4-4]+o[q-w*4+4]+o[q+w*4-4]+o[q+w*4+4])/9;d[q]=o[q]+.8*(o[q]-bl)}}
 x.putImageData(id,0,0);out(c,"upscaled-"+cur[vi].name,"Upscaled photo")};

/* ---------- optional lock, settings, boot ---------- */
function setupLock(){$("#set").hidden=true;$("#vw").hidden=true;mode="pin";tmp="";lockUI();$("#lock").hidden=false}

let rl=0;
function sync(){$("#sls").textContent=cfg?"On: "+cfg.t+" lock":"Off. Sid’s View opens right away, and the vault needs a lock.";$("#ssu").hidden=!!cfg;$("#sln").hidden=!cfg;$("#srm").hidden=!cfg;$("#srm").textContent=rl?"Tap again to confirm":"Remove lock";$("#sl").classList.toggle("on",root.dataset.theme=="light");$("#sd").classList.toggle("on",root.dataset.theme=="dark")}

$("#sl").onclick=()=>{theme("light");sync()};$("#sd").onclick=()=>{theme("dark");sync()};
$("#ssu").onclick=setupLock;$("#sln").onclick=()=>{$("#set").hidden=true;lock()};
$("#srm").onclick=async()=>{
 if(!rl){rl=1;sync();setTimeout(()=>{rl=0;sync()},4000);return}
 let n=0;for(const r of vault){try{const b=await crypto.subtle.decrypt({name:"AES-GCM",iv:r.iv},vkey,r.data);await add(new File([b],r.name,{type:r.type}));n++}catch{}}
 vault.forEach(r=>st("readwrite",o=>o.delete(r.id)));vault=[];cfg=null;secret=vkey=null;try{localStorage.removeItem("pg_cfg")}catch{}
 rl=0;sync();toast(n?"Lock removed. "+n+" vault files restored to your gallery.":"Lock removed");render()};
addEventListener("pointermove",e=>{const el=e.target.closest?.(".gl");if(el){const r=el.getBoundingClientRect();el.style.setProperty("--mx",e.clientX-r.left+"px");el.style.setProperty("--my",e.clientY-r.top+"px")}});
if(cfg)lock();else{$("#app").hidden=false;render()}
