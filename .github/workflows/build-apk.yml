name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Set app name
        run: |
          cat > android/app/src/main/res/values/strings.xml <<'XML'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">Sid\'s View</string>
              <string name="title_activity_main">Sid\'s View</string>
              <string name="package_name">com.sidsview.app</string>
              <string name="custom_url_scheme">com.sidsview.app</string>
          </resources>
          XML
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SidsView-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
